<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>Login interactif</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="premier.css">
    <script src="premier.js" defer></script>
  </head>
  <body>
    <div class="contenaire">
      <section class="box" >
        
        <form action="#" method="post" class="formulaire" id="login"> 
          <h3> WELCOME BACK</h3>
          <input type="text" id="username" name="username" placeholder="Username/email" value="">
          
          <input type="password" id="password" name="password" placeholder="Password" value="">
          <span id="errorLogin"></span>
          <button type="submit">Login</button>
          <a href="exemple.com">Forgot your password ?</a>
          <a href="#newaccount" id="creat"> Creat a new account ?</a>
          
        </form>
      </section>
      <section class="box" id="lamp">
        <img src="image/1.jpeg" alt="lamp_etteint" id="image">
        
      </section>
      <section class="box" >
        <form action="#" method="post" class="formulaire" id="newaccount" >
          <h2>CREAT ACCOUNT </h2>
          <input type="text" name="username" id="name" value="" placeholder="Name">
          <input type="email" name="email" id="email" value="" placeholder="Email address">
          <input type="password" name="password" id="newPassword" value="" placeholder="Password(more than 10)">
          <span id="errorNewaccount"></span>
          <button type="submit"> Creat </button>
          

        </form>

      </section>
    </div>
    
  </body>

</html>
